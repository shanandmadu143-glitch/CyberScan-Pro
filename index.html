<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GitHub File Manager Pro</title>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<style>
:root{--bg:#0b0f14;--panel:#111821;--panel2:#17202b;--line:#263241;--text:#f5f7fa;--muted:#9aa8b8;--accent:#2f81f7;--danger:#f85149;--ok:#3fb950;--radius:18px}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#0b0f14,#0e141c);color:var(--text);font:15px system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
button,input,textarea,select{font:inherit}button{border:0;cursor:pointer}.app{max-width:1200px;margin:auto;min-height:100vh;padding-bottom:84px}
header{position:sticky;top:0;z-index:20;background:rgba(11,15,20,.92);backdrop-filter:blur(16px);border-bottom:1px solid var(--line);padding:14px 16px}
.top{display:flex;gap:12px;align-items:center}.logo{font-size:21px;font-weight:800}.status{margin-left:auto;color:var(--muted);font-size:12px}
main{padding:16px}.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:flex;flex-direction:column;gap:7px}.field label{color:var(--muted);font-size:12px}
input,textarea,select{width:100%;background:#0d131b;color:var(--text);border:1px solid var(--line);border-radius:12px;padding:12px;outline:none}textarea{min-height:280px;resize:vertical}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.btn{padding:10px 14px;border-radius:12px;background:var(--panel2);color:var(--text);border:1px solid var(--line)}.primary{background:var(--accent);border-color:var(--accent);color:white}.danger{background:rgba(248,81,73,.12);border-color:rgba(248,81,73,.4);color:#ff7b72}.success{background:rgba(63,185,80,.12);border-color:rgba(63,185,80,.4);color:#56d364}
.toolbar{display:flex;gap:8px;align-items:center;margin-bottom:12px}.toolbar input{flex:1}
.repo,.item{display:flex;align-items:center;gap:11px;padding:13px;border:1px solid var(--line);background:#0f151d;border-radius:14px;margin-top:8px}.repo:hover,.item:hover{border-color:#405064}
.repo-main,.item-main{min-width:0;flex:1}.name{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.meta{font-size:12px;color:var(--muted);margin-top:3px}
.icon{width:38px;height:38px;border-radius:11px;background:#192432;display:grid;place-items:center;flex:none}.check{width:19px;height:19px;accent-color:var(--accent)}
.empty{text-align:center;color:var(--muted);padding:35px 10px}.hidden{display:none!important}
.bottom{position:fixed;bottom:0;left:0;right:0;z-index:30;background:rgba(11,15,20,.96);border-top:1px solid var(--line);display:flex;justify-content:center;gap:6px;padding:9px env(safe-area-inset-right) calc(9px + env(safe-area-inset-bottom)) env(safe-area-inset-left)}
.bottom button{background:none;color:var(--muted);padding:7px 15px;border-radius:12px}.bottom button.active{background:#172335;color:white}
.progress{height:8px;background:#0a0f15;border-radius:99px;overflow:hidden}.bar{height:100%;width:0;background:var(--accent);transition:width .2s}
.toast{position:fixed;left:50%;bottom:78px;transform:translateX(-50%);z-index:50;background:#1b2633;border:1px solid var(--line);padding:12px 16px;border-radius:13px;max-width:min(92vw,600px);box-shadow:0 10px 35px #0008}
.modal{position:fixed;inset:0;z-index:40;background:#0009;display:grid;place-items:center;padding:15px}.modalbox{width:min(720px,100%);max-height:92vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:17px}
.spinner{display:inline-block;width:15px;height:15px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .65s linear infinite;vertical-align:-2px;margin-right:7px}
@keyframes spin{to{transform:rotate(360deg)}}
.busy{opacity:.72!important;pointer-events:none}
.action-loading{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:60;background:rgba(17,24,33,.96);border:1px solid var(--line);border-radius:18px;padding:18px 22px;min-width:190px;text-align:center;box-shadow:0 18px 55px #0009;backdrop-filter:blur(12px)}
.action-loading .bigspin{width:28px;height:28px;border-width:3px;margin:0 auto 9px;display:block}
.checkrow{display:flex;align-items:center;gap:9px;color:var(--muted);font-size:13px;margin-top:9px}
.checkrow input{width:auto}
.progress-wrap{display:flex;align-items:center;gap:9px}
.progress-wrap .progress{flex:1}
.progress-percent{min-width:44px;text-align:right;font-size:12px;color:var(--muted)}

@media(max-width:650px){main{padding:10px}.grid{grid-template-columns:1fr}.card{padding:13px}.status{display:none}.actions .btn{flex:1}.toolbar{flex-wrap:wrap}.toolbar input{flex-basis:100%}}
</style>
</head>
<body>
<div class="app">
<header><div class="top"><div class="logo">◈ GitHub File Manager</div><div id="status" class="status">Disconnected</div></div></header>
<main>
<section id="connectView">
<div class="card"><h2>GitHub Connection</h2><p class="meta">Use a Fine-grained PAT with repository <b>Contents: Read and write</b>. For automatic GitHub Pages setup, also allow <b>Pages: Read and write</b> and <b>Administration: Read and write</b>.</p>
<div class="field"><label>Personal Access Token</label><input id="token" type="password" autocomplete="off" placeholder="github_pat_..."></div>
<label class="checkrow"><input id="rememberToken" type="checkbox"> Remember PAT on this device</label>
<div id="savedTokenHint" class="meta" style="margin-top:7px"></div>
<div class="actions"><button class="btn primary" id="connectBtn">Connect</button><button class="btn" id="clearBtn">Clear</button></div></div>
</section>

<section id="dashboardView" class="hidden">
<div class="card"><div class="toolbar"><div><b id="userName">GitHub</b><div id="userLogin" class="meta"></div></div><button class="btn" id="refreshRepos">Refresh</button></div>
<div class="actions"><button class="btn primary" id="newRepoBtn">＋ New Repository</button><button class="btn danger" id="disconnectBtn">Disconnect</button></div></div>
<div class="card"><div class="toolbar"><input id="repoSearch" placeholder="Search repositories..."></div><div id="repoList"></div></div>
</section>

<section id="repoView" class="hidden">
<div class="card"><div class="toolbar"><button class="btn" id="backRepos">←</button><div class="repo-main"><b id="repoTitle">Repository</b><div id="repoMeta" class="meta"></div></div><button class="btn" id="refreshFiles">↻</button></div>
<div class="grid"><div class="field"><label>Branch</label><select id="branchSelect"></select></div><div class="field"><label>Current path</label><input id="currentPath" readonly></div></div>
<div class="actions"><button class="btn primary" id="uploadBtn">＋ Files</button><button class="btn primary" id="zipBtn">📦 ZIP Project</button><button class="btn success" id="pagesBtn">🌐 Pages</button><button class="btn danger" id="deleteSelected">Delete selected</button></div>
<input id="fileInput" type="file" multiple class="hidden"><input id="zipInput" type="file" accept=".zip,application/zip" class="hidden">
<div id="uploadProgress" class="hidden" style="margin-top:12px"><div class="progress-wrap"><div class="progress"><div id="progressBar" class="bar"></div></div><div id="progressPercent" class="progress-percent">0%</div></div><div id="progressText" class="meta" style="margin-top:6px"></div></div>
</div>
<div class="card"><div class="toolbar"><button class="btn" id="upBtn">↑ Up</button><button class="btn" id="selectAllBtn">Select all</button><input id="fileSearch" placeholder="Search files..."></div><div id="fileList"></div></div>
</section>
</main>
<nav class="bottom"><button id="navHome" class="active">⌂ Home</button><button id="navRepo">▣ Repositories</button><button id="navConnect">⚙ Connection</button></nav>
</div>

<div id="modal" class="modal hidden"><div class="modalbox"><div id="modalContent"></div></div></div>
<div id="toast" class="toast hidden"></div>

<script>
'use strict';
const API='https://api.github.com';
const $=id=>document.getElementById(id);
const state={token:'',user:null,repos:[],repo:null,branch:'',path:'',items:[],selected:new Set(),busy:false};
const TOKEN_KEY='gh_file_manager_pat_v2';
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function toast(m){$('toast').textContent=m;$('toast').classList.remove('hidden');clearTimeout(toast.t);toast.t=setTimeout(()=>$('toast').classList.add('hidden'),3500)}
function setBusy(on,label='Working…'){
  state.busy=on;
  ['uploadBtn','zipBtn','deleteSelected','refreshFiles','upBtn','selectAllBtn','branchSelect'].forEach(id=>{
    const el=$(id); if(el) el.classList.toggle('busy',on);
  });
  let box=$('actionLoading');
  if(on){
    if(!box){box=document.createElement('div');box.id='actionLoading';box.className='action-loading';document.body.appendChild(box)}
    box.innerHTML='<span class="spinner bigspin"></span><div>'+esc(label)+'</div>';
    box.classList.remove('hidden');
  }else if(box){box.classList.add('hidden')}
}
function setProgress(done,total,label=''){
  const pct=total?Math.round(done/total*100):0;
  $('progressBar').style.width=pct+'%';
  $('progressPercent').textContent=pct+'%';
  $('progressText').textContent=label || `${done}/${total}`;
}
function saveTokenIfNeeded(){
  if($('rememberToken').checked && state.token) localStorage.setItem(TOKEN_KEY,state.token);
  else localStorage.removeItem(TOKEN_KEY);
  updateSavedHint();
}
function updateSavedHint(){
  const has=!!localStorage.getItem(TOKEN_KEY);
  $('savedTokenHint').textContent=has?'A PAT is saved on this device.':'PAT is not saved on this device.';
}
function restoreSavedToken(){
  const saved=localStorage.getItem(TOKEN_KEY);
  if(saved){
    $('token').value=saved;
    $('rememberToken').checked=true;
  }
  updateSavedHint();
}

function show(view){['connectView','dashboardView','repoView'].forEach(x=>$(x).classList.toggle('hidden',x!==view));$('navHome').classList.toggle('active',view==='dashboardView');$('navRepo').classList.toggle('active',view==='repoView');$('navConnect').classList.toggle('active',view==='connectView')}
function headers(json=false){return {'Accept':'application/vnd.github+json','Authorization':'Bearer '+state.token,'X-GitHub-Api-Version':'2026-03-10',...(json?{'Content-Type':'application/json'}:{})}}
async function api(url,opt={}){const r=await fetch(API+url,{...opt,headers:{...headers(!!opt.body),...(opt.headers||{})}});let data=null;try{data=await r.json()}catch{}if(!r.ok){const msg=data?.message||r.statusText||('HTTP '+r.status);throw new Error(r.status+' '+msg)}return data}
function pathUrl(owner,repo,path){const base=`/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}/contents`;const clean=path.split('/').filter(Boolean).map(encodeURIComponent).join('/');return clean?base+'/'+clean:base}
function b64(bytes){let s='';const chunk=0x8000;for(let i=0;i<bytes.length;i+=chunk)s+=String.fromCharCode(...bytes.subarray(i,i+chunk));return btoa(s)}
async function getFile(owner,repo,path,branch){try{return await api(pathUrl(owner,repo,path)+'?ref='+encodeURIComponent(branch))}catch(e){if(e.message.startsWith('404 '))return null;throw e}}
async function putFile(path,bytes,message){const existing=await getFile(state.user.login,state.repo.name,path,state.branch);const body={message,content:b64(bytes),branch:state.branch};if(existing?.sha)body.sha=existing.sha;await api(pathUrl(state.user.login,state.repo.name,path),{method:'PUT',body:JSON.stringify(body)})}
async function deleteFile(path){const existing=await getFile(state.user.login,state.repo.name,path,state.branch);if(!existing?.sha)throw new Error('File not found: '+path);await api(pathUrl(state.user.login,state.repo.name,path),{method:'DELETE',body:JSON.stringify({message:'Delete '+path,sha:existing.sha,branch:state.branch})})}
async function connect(){
  const t=$('token').value.trim();
  if(!t)return toast('Enter your GitHub token');
  state.token=t;
  saveTokenIfNeeded();
  const btn=$('connectBtn'), old=btn.innerHTML;
  btn.innerHTML='<span class="spinner"></span>Connecting…';btn.classList.add('busy');
  try{
    const u=await api('/user');
    state.user=u;
    state.repos=await api('/user/repos?per_page=100&sort=updated');
    $('userName').textContent=u.name||u.login;
    $('userLogin').textContent='@'+u.login;
    $('status').textContent='Connected as @'+u.login;
    show('dashboardView');renderRepos();
    toast('Connected successfully');
  }catch(e){
    if(!$('rememberToken').checked)localStorage.removeItem(TOKEN_KEY);
    state.token='';
    toast('Connection failed: '+e.message);
  }finally{
    btn.innerHTML=old;btn.classList.remove('busy');updateSavedHint();
  }
}
function renderRepos(){const q=$('repoSearch').value.toLowerCase();const rs=state.repos.filter(r=>r.full_name.toLowerCase().includes(q)||r.name.toLowerCase().includes(q));$('repoList').innerHTML=rs.length?rs.map(r=>`<div class="repo"><div class="icon">▣</div><div class="repo-main"><div class="name">${esc(r.name)}</div><div class="meta">${r.private?'Private':'Public'} · ${esc(r.default_branch||'main')}</div></div><button class="btn" data-open="${esc(r.name)}">Open</button></div>`).join(''):'<div class="empty">No repositories found</div>';document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openRepo(b.dataset.open))}
async function openRepo(name){const r=state.repos.find(x=>x.name===name);if(!r)return;state.repo=r;state.path='';state.selected.clear();$('repoTitle').textContent=r.name;$('repoMeta').textContent=r.private?'Private repository':'Public repository';try{const branches=await api(`/repos/${encodeURIComponent(state.user.login)}/${encodeURIComponent(r.name)}/branches?per_page=100`);$('branchSelect').innerHTML=branches.map(b=>`<option value="${esc(b.name)}">${esc(b.name)}</option>`).join('');state.branch=r.default_branch||branches[0]?.name||'main';$('branchSelect').value=state.branch;show('repoView');await loadFiles()}catch(e){toast('Repository open failed: '+e.message)}}
async function loadFiles(){if(!state.repo)return;state.selected.clear();$('currentPath').value=state.path||'/';try{const u=pathUrl(state.user.login,state.repo.name,state.path||'')+'?ref='+encodeURIComponent(state.branch);const data=await api(u);state.items=Array.isArray(data)?data:[data];renderFiles()}catch(e){if(e.message.startsWith('404 ')){state.items=[];renderFiles();toast('Folder is empty or not found')}else toast('Load failed: '+e.message)}}
function renderFiles(){
  const q=$('fileSearch').value.toLowerCase();
  const list=state.items.filter(x=>x.name.toLowerCase().includes(q));
  $('fileList').innerHTML=list.length?list.map(x=>`<div class="item">
    <input class="check" type="checkbox" data-path="${esc(x.path)}" ${state.selected.has(x.path)?'checked':''}>
    <div class="icon">${x.type==='dir'?'📁':'📄'}</div>
    <div class="item-main"><div class="name">${esc(x.name)}</div><div class="meta">${esc(x.type)} · ${x.size||0} bytes</div></div>
    ${x.type==='dir'?`<button class="btn" data-dir="${esc(x.path)}">Open</button>`:`<button class="btn" data-edit="${esc(x.path)}">Edit</button>`}
  </div>`).join(''):'<div class="empty">No files</div>';
  document.querySelectorAll('.check').forEach(c=>c.onchange=()=>{
    if(c.checked)state.selected.add(c.dataset.path); else state.selected.delete(c.dataset.path);
    updateSelectionInfo();
  });
  document.querySelectorAll('[data-dir]').forEach(b=>b.onclick=()=>{if(state.busy)return;state.path=b.dataset.dir;loadFiles()});
  document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>editFile(b.dataset.edit));
  updateSelectionInfo();
}
function updateSelectionInfo(){
  const n=state.selected.size;
  const btn=$('deleteSelected');
  if(btn)btn.textContent=n?`Delete selected (${n})`:'Delete selected';
}

async function editFile(path){try{const d=await getFile(state.user.login,state.repo.name,path,state.branch);if(!d?.content)return toast('This file cannot be edited as text');let text=atob(d.content.replace(/\n/g,''));try{text=decodeURIComponent(escape(text))}catch{}openModal(`<h3>Edit ${esc(path)}</h3><textarea id="editText">${esc(text)}</textarea><div class="actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" id="saveEdit">Save</button></div>`);$('saveEdit').onclick=async()=>{
  if(state.busy)return;
  const b=$('saveEdit'),old=b.innerHTML;b.innerHTML='<span class="spinner"></span>Saving…';b.classList.add('busy');
  try{await putFile(path,new TextEncoder().encode($('editText').value),'Update '+path);toast('Saved successfully');closeModal();await loadFiles()}
  catch(e){toast('Save failed: '+e.message)}
  finally{b.innerHTML=old;b.classList.remove('busy')}
}}catch(e){toast('Edit failed: '+e.message)}}

function detectProject(entries,rootFiles){
  const lowerMap=new Map(entries.map(x=>[x.path.toLowerCase(),x]));
  const names=[...lowerMap.keys()];
  const has=n=>names.includes(n)||names.some(x=>x.endsWith('/'+n));
  const findPath=n=>names.find(x=>x===n||x.endsWith('/'+n));
  let pkgData=null, pkgPath=findPath('package.json');
  if(pkgPath){try{pkgData=JSON.parse(lowerMap.get(pkgPath)?.text||'{}')}catch{}}
  const deps={...(pkgData?.dependencies||{}),...(pkgData?.devDependencies||{})};
  let type='Static Web', details='HTML/CSS/JavaScript web project';
  let install=null, build=false, output='.';
  let pages=true, reason='';
  let framework='static';

  if(pkgData){
    install=has('package-lock.json')?'npm ci':has('yarn.lock')?'yarn install --frozen-lockfile':has('pnpm-lock.yaml')?'pnpm install --frozen-lockfile':'npm install';
    build=!!pkgData.scripts?.build;
    if(deps.next){
      type='Next.js'; framework='next'; details='Next.js web application';
      const cfg=entries.find(x=>/(^|\/)next\.config\.(js|mjs|cjs|ts)$/.test(x.path.toLowerCase()));
      const cfgText=(cfg?.text||'').replace(/\s/g,'').toLowerCase();
      const isExport=cfgText.includes('output:"export"')||cfgText.includes("output:'export'")||cfgText.includes('output:`export`');
      if(isExport){output='out';pages=true;reason='Next.js static export detected.'}
      else {pages=false;reason='Next.js server mode detected. GitHub Pages cannot run the Node server; configure output: export or deploy the app to a server platform.'}
    }else if(deps.vite){
      type='Vite'; framework='vite'; details='Vite web application'; output='dist'; pages=true;
    }else if(deps.react||deps['react-dom']){
      type='React'; framework='react'; details='React web application'; output='build'; pages=true;
      if(deps.vite){framework='vite';output='dist'}
    }else if(deps['@angular/core']){
      type='Angular'; framework='angular'; details='Angular web application'; output='dist'; pages=true;
    }else if(deps.vue){
      type='Vue'; framework='vue'; details='Vue web application'; output='dist'; pages=true;
    }else if(deps.svelte||deps['@sveltejs/kit']){
      type='Svelte'; framework='svelte'; details='Svelte web application'; output='build'; pages=true;
    }else{
      type='Node.js'; framework='node'; details='Node.js project/application'; pages=has('index.html'); output='.';
      if(build)reason='Generic Node build detected; Pages can only publish static output.';
    }
  }else if(has('requirements.txt')||has('pyproject.toml')||has('manage.py')){
    type='Python'; framework='python'; details='Python web/application project'; pages=false;
    reason='Python server applications cannot run on GitHub Pages.';
  }else if(has('composer.json')){
    type='PHP'; framework='php'; details='PHP/Composer project'; pages=false;
    reason='PHP server applications cannot run on GitHub Pages.';
  }else if(has('index.html')){
    type='Static Web'; framework='static'; details='Static HTML/CSS/JavaScript website'; pages=true; output='.';
  }else{
    type='Unknown'; framework='unknown'; details='Project files detected, but no supported web entry point was found'; pages=false;
    reason='No index.html or recognized static web build configuration was found.';
  }

  // Root index is required for direct/static Pages publishing.
  if(pages && output==='.' && !has('index.html')){
    pages=false;
    reason='No top-level index.html was detected for static publishing.';
  }
  return {type,details,pkg:pkgData,install,build,output,pages,framework,reason};
}
function makeNodeWorkflow(info){
  const install=info.install==='npm ci'?'npm ci':info.install==='yarn install --frozen-lockfile'?'corepack enable\nyarn install --frozen-lockfile':info.install==='pnpm install --frozen-lockfile'?'corepack enable\npnpm install --frozen-lockfile':'npm install';
  const build=info.build?`\n      - name: Build\n        run: npm run build`:''; 
  const out=info.output||'.';
  const deploy=info.pages?`
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${out}
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4`:'';
  const permissions=info.pages?`permissions:
  contents: read
  pages: write
  id-token: write

`:''; 
  return `name: Build and Deploy ${info.type}

on:
  push:
    branches: ["${state.branch}"]
  workflow_dispatch:

${permissions}concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
${info.install?`      - name: Install dependencies
        run: |
          ${install.replace(/\n/g,'\n          ')}`:''}${build}
${deploy?deploy.replace(/\n/g,'\n'):''}
`;
}
function makePythonWorkflow(){
  return `name: Python Project Check

on:
  push:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
`;
}
function makePhpWorkflow(){
  return `name: PHP Project Check

on:
  push:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist
`;
}
async function createProjectWorkflow(info){
  if(info.type==='Static Web'){
    if(!info.pages)return false;
    const text=`name: Deploy Static Website to GitHub Pages

on:
  push:
    branches: ["${state.branch}"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: \${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
`;
    await putFile('.github/workflows/pages-deploy.yml',new TextEncoder().encode(text),'Configure GitHub Pages deployment');
    return true;
  }
  if(info.type==='Python') return false;
  if(info.type==='PHP') return false;
  if(info.pages){
    await putFile('.github/workflows/pages-deploy.yml',new TextEncoder().encode(makeNodeWorkflow(info)),'Configure project build and GitHub Pages deployment');
    return true;
  }
  await putFile('.github/workflows/project-setup.yml',new TextEncoder().encode(makeNodeWorkflow({...info,pages:false})),'Add project setup workflow');
  return true;
}
async function configurePages(){
  const owner=state.user.login, repo=state.repo.name;
  const base=`/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}/pages`;
  const body={build_type:'workflow',source:{branch:state.branch,path:'/'}};
  try{
    const current=await api(base);
    await api(base,{method:'PUT',body:JSON.stringify(body)});
    return current?.html_url||`https://${owner}.github.io/${repo}/`;
  }catch(e){
    if(e.message.startsWith('404 ')){
      const created=await api(base,{method:'POST',body:JSON.stringify(body)});
      return created?.html_url||`https://${owner}.github.io/${repo}/`;
    }
    throw e;
  }
}
function projectSetupModal(info,count){
  const pagesPossible=info.pages;
  const disabledReason=info.reason?`<div class="meta" style="margin-top:7px">⚠️ ${esc(info.reason)}</div>`:'';
  openModal(`<h3>Smart Project Analysis</h3>
    <div class="card" style="margin:12px 0;padding:14px">
      <div><b>${esc(info.type)}</b></div>
      <div class="meta">${esc(info.details)} · ${count} files</div>
      ${info.install?`<div class="meta" style="margin-top:8px">Install: <b>${esc(info.install)}</b>${info.build?' · Build: npm run build':''} · Output: <b>${esc(info.output)}</b></div>`:''}
      ${disabledReason}
    </div>
    <label class="checkrow"><input id="autoProjectSetup" type="checkbox" checked> Create project setup/build workflow</label>
    ${pagesPossible?`<label class="checkrow"><input id="autoPages" type="checkbox" checked> Configure GitHub Pages + deploy automatically</label>
      <div class="meta" style="margin-top:7px">The app will publish the detected static/build output so the Pages artifact contains the correct top-level entry file.</div>`:
      '<div class="meta" style="margin-top:7px">GitHub Pages deployment is disabled for this project type because Pages only serves static output.</div>'}
    <div class="actions"><button class="btn" id="projectSkip">Upload only</button><button class="btn primary" id="projectContinue">Continue</button></div>`);
  return new Promise(resolve=>{
    $('projectSkip').onclick=()=>{closeModal();resolve({setup:false,pages:false})};
    $('projectContinue').onclick=()=>{
      const setup=$('autoProjectSetup')?.checked;
      const pages=pagesPossible&&$('autoPages')?.checked;
      closeModal();resolve({setup,pages});
    };
  });
}
async function uploadFiles(files,zip=false){
  if(state.busy||!files.length)return;
  const arr=[]; let projectInfo=null; let setupWorkflow=false; let enablePages=false;
  if(zip){
    if(!window.JSZip)return toast('ZIP library failed to load');
    try{
      const z=await JSZip.loadAsync(files[0]);
      const raw=[];
      for(const [p,o] of Object.entries(z.files)){
        if(o.dir)continue;
        let clean=p.replace(/^\/+/,'').split('/').filter(x=>x&&x!=='.'&&x!=='..').join('/');
        if(!clean||clean.startsWith('__MACOSX/')||clean==='.DS_Store'||clean.endsWith('/.DS_Store'))continue;
        raw.push({path:clean,obj:o});
      }
      if(!raw.length)return toast('ZIP contains no usable files');
      const tops=new Set(raw.map(x=>x.path.split('/')[0]));
      if(tops.size===1 && raw.every(x=>x.path.includes('/'))){
        const root=[...tops][0]; raw.forEach(x=>x.path=x.path.slice(root.length+1));
      }
      const entries=[];
      for(const x of raw){
        const lower=x.path.toLowerCase();
        let text=null;
        if(['package.json','requirements.txt','pyproject.toml','composer.json','index.html'].some(n=>lower===n)||/next\.config\.(js|mjs|cjs|ts)$/i.test(lower)){
          try{text=await x.obj.async('text')}catch{}
        }
        entries.push({path:x.path,text});
      }
      projectInfo=detectProject(entries,raw.map(x=>x.path));
      const choice=await projectSetupModal(projectInfo,raw.length);
      setupWorkflow=choice.setup; enablePages=choice.pages;
      for(const x of raw)arr.push({path:(state.path?state.path+'/':'')+x.path,bytes:await x.obj.async('uint8array')});
    }catch(e){return toast('ZIP/project analysis failed: '+e.message)}
  }else{
    for(const f of files)arr.push({path:(state.path?state.path+'/':'')+f.name,bytes:new Uint8Array(await f.arrayBuffer())});
  }
  if(!arr.length)return toast('No files to upload');
  $('uploadProgress').classList.remove('hidden');
  setProgress(0,arr.length,'Preparing upload…');
  setBusy(true,zip?`Uploading ${projectInfo?.type||'project'}…`:'Uploading files…');
  let done=0,failed=false;
  try{
    for(const x of arr){
      try{await putFile(x.path,x.bytes,'Upload '+x.path);done++;setProgress(done,arr.length,x.path)}
      catch(e){failed=true;toast(`Stopped after ${done}/${arr.length}: ${x.path} — ${e.message}`);break}
    }
    if(!failed&&done===arr.length&&zip&&setupWorkflow){
      try{
        setBusy(true,'Creating project workflow…');
        await createProjectWorkflow(projectInfo);
      }catch(e){toast(`${done} files uploaded, but workflow creation failed: ${e.message}`)}
    }
    if(!failed&&done===arr.length&&zip&&enablePages&&projectInfo?.pages){
      try{
        setBusy(true,'Configuring GitHub Pages…');
        const url=await configurePages();
        toast(`Project uploaded. GitHub Pages configured: ${url}`);
      }catch(e){
        toast(`Project uploaded, but Pages could not be configured: ${e.message}. Add Pages write + Administration write permissions.`);
      }
    }else if(!failed&&done===arr.length){
      toast(`Uploaded ${done} file(s) successfully`);
    }
    await loadFiles();
  }finally{
    setTimeout(()=>{$('uploadProgress').classList.add('hidden');setProgress(0,arr.length,'')},500);
    $('fileInput').value='';$('zipInput').value='';setBusy(false);
  }
}
async function getTreeFiles(){
  const data=await api(`/repos/${encodeURIComponent(state.user.login)}/${encodeURIComponent(state.repo.name)}/git/trees/${encodeURIComponent(state.branch)}?recursive=1`);
  return (data.tree||[]).filter(x=>x.type==='blob').map(x=>x.path);
}
async function deleteSelected(){
  if(state.busy)return;
  const selected=[...state.selected];
  if(!selected.length)return toast('Select one or more files/folders first');
  let allFiles=[];
  try{
    const tree=await getTreeFiles();
    const set=new Set();
    for(const p of selected){
      const item=state.items.find(x=>x.path===p);
      if(item?.type==='dir') tree.filter(x=>x===p||x.startsWith(p+'/')).forEach(x=>set.add(x));
      else set.add(p);
    }
    allFiles=[...set];
  }catch(e){return toast('Could not inspect selected folders: '+e.message)}
  if(!allFiles.length)return toast('No files found under the selected item(s)');
  if(!confirm(`Delete ${allFiles.length} file(s) from ${selected.length} selected item(s)?\nFolders are deleted by removing all files inside them.`))return;
  setBusy(true,`Deleting 0/${allFiles.length} files…`);
  let ok=0,failed=false;
  try{
    for(const p of allFiles){
      try{await deleteFile(p);ok++;setBusy(true,`Deleting ${ok}/${allFiles.length} files…`)}
      catch(e){failed=true;toast(`Deleted ${ok}/${allFiles.length}. Failed: ${p} — ${e.message}`);break}
    }
    await loadFiles();
    if(!failed)toast(`Deleted ${ok} file(s) successfully`);
  }finally{setBusy(false)}
}

function openModal(c){$('modalContent').innerHTML=c;$('modal').classList.remove('hidden')}function closeModal(){$('modal').classList.add('hidden')}
async function newRepo(){openModal(`<h3>New Repository</h3><div class="field"><label>Name</label><input id="rn" placeholder="my-project"></div><div class="field"><label>Description</label><input id="rd" placeholder="Optional"></div><div class="field"><label>Visibility</label><select id="rv"><option value="false">Public</option><option value="true">Private</option></select></div><div class="actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" id="createRepo">Create</button></div>`);$('createRepo').onclick=async()=>{const name=$('rn').value.trim();if(!name)return toast('Repository name required');try{await api('/user/repos',{method:'POST',body:JSON.stringify({name,description:$('rd').value.trim(),private:$('rv').value==='true',auto_init:true})});closeModal();await refreshRepos();toast('Repository created')}catch(e){toast('Create failed: '+e.message)}}}
async function refreshRepos(){state.repos=await api('/user/repos?per_page=100&sort=updated');renderRepos()}
$('connectBtn').onclick=connect;
$('rememberToken').onchange=saveTokenIfNeeded;
$('clearBtn').onclick=()=>{
  $('token').value='';state.token='';
  $('rememberToken').checked=false;
  localStorage.removeItem(TOKEN_KEY);
  updateSavedHint();
  toast('Saved PAT cleared from this device');
};
$('refreshRepos').onclick=async()=>{
  const b=$('refreshRepos'),old=b.innerHTML;b.innerHTML='<span class="spinner"></span>Refreshing…';b.classList.add('busy');
  try{await refreshRepos();toast('Repositories refreshed')}catch(e){toast(e.message)}
  finally{b.innerHTML=old;b.classList.remove('busy')}
};

  state.token='';state.user=null;
  show('connectView');
  $('status').textContent='Disconnected';
  $('token').value=localStorage.getItem(TOKEN_KEY)||'';
  $('rememberToken').checked=!!localStorage.getItem(TOKEN_KEY);
  updateSavedHint();
};
$('backRepos').onclick=()=>show('dashboardView');
$('refreshFiles').onclick=async()=>{
  if(state.busy)return;
  const b=$('refreshFiles'),old=b.innerHTML;b.innerHTML='<span class="spinner"></span>';b.classList.add('busy');
  try{await loadFiles()}finally{b.innerHTML=old;b.classList.remove('busy')}
};
$('branchSelect').onchange=()=>{state.branch=$('branchSelect').value;state.path='';loadFiles()};
$('uploadBtn').onclick=()=>state.busy?null:$('fileInput').click();
$('zipBtn').onclick=()=>state.busy?null:$('zipInput').click();
$('fileInput').onchange=e=>uploadFiles([...e.target.files]);
$('zipInput').onchange=e=>uploadFiles([...e.target.files],true);
$('deleteSelected').onclick=deleteSelected;
$('pagesBtn').onclick=async()=>{
  if(state.busy||!state.repo)return;
  try{
    setBusy(true,'Checking GitHub Pages…');
    let info=null;
    try{info=await api(`/repos/${encodeURIComponent(state.user.login)}/${encodeURIComponent(state.repo.name)}/pages`)}catch(e){if(!e.message.startsWith('404 '))throw e}
    if(info?.html_url){
      openModal(`<h3>GitHub Pages</h3><div class="meta">Current status: ${esc(info.status||'unknown')}</div><div class="actions"><a class="btn primary" href="${esc(info.html_url)}" target="_blank" rel="noopener">Open site</a><button class="btn" id="rebuildPages">Rebuild</button><button class="btn" onclick="closeModal()">Close</button></div>`);
      $('rebuildPages').onclick=async()=>{try{await api(`/repos/${encodeURIComponent(state.user.login)}/${encodeURIComponent(state.repo.name)}/pages/builds`,{method:'POST',body:JSON.stringify({})});toast('Pages rebuild requested');closeModal()}catch(e){toast('Rebuild failed: '+e.message)}};
    }else{
      const infoMsg=`This repository does not have GitHub Pages configured.\\n\\nFor automatic setup, upload a ZIP project and choose “Configure GitHub Pages + deploy automatically”.`;
      toast(infoMsg);
    }
  }catch(e){toast('Pages check failed: '+e.message)}
  finally{setBusy(false)}
};
$('fileSearch').oninput=renderFiles;
$('upBtn').onclick=()=>{if(state.busy||!state.path)return;state.path=state.path.split('/').slice(0,-1).join('/');loadFiles()};
$('selectAllBtn').onclick=()=>{
  if(state.busy)return;
  state.items.forEach(x=>state.selected.add(x.path));renderFiles()
};
$('navHome').onclick=()=>state.user?show('dashboardView'):show('connectView');
$('navRepo').onclick=()=>state.user?show('repoView'):toast('Connect first');
$('navConnect').onclick=()=>show('connectView');
restoreSavedToken();
</script>
