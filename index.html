<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"
>

<meta name="theme-color" content="#05070a">
<meta
    name="description"
    content="CyberScan Pro - Web Link and Connectivity Analyzer"
>

<title>CyberScan Pro 2026</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

:root{
    --bg:#05070a;
    --panel:#0b1016;
    --panel2:#101720;
    --line:rgba(255,255,255,.09);
    --text:#f5f7fa;
    --muted:#8793a1;
    --green:#00ffaa;
    --blue:#1498ff;
    --red:#ff4d70;
    --yellow:#ffd34d;
    --shadow:0 20px 60px rgba(0,0,0,.42);
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{
    min-height:100vh;
    background:
        radial-gradient(
            circle at 10% 5%,
            rgba(0,255,170,.09),
            transparent 28%
        ),
        radial-gradient(
            circle at 90% 10%,
            rgba(20,152,255,.10),
            transparent 30%
        ),
        var(--bg);
    color:var(--text);
    font-family:Inter,Arial,sans-serif;
}

button,
input,
select{
    font:inherit;
}

button{
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
}

button:disabled{
    cursor:not-allowed;
}

.app{
    width:min(1120px,100%);
    margin:auto;
    padding:14px;
}

.top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    margin-bottom:14px;
}

.brand{
    display:flex;
    align-items:center;
    gap:10px;
    min-width:0;
}

.logo{
    width:43px;
    height:43px;
    flex:0 0 43px;
    border-radius:13px;
    display:grid;
    place-items:center;
    background:linear-gradient(
        135deg,
        var(--green),
        var(--blue)
    );
    color:#00140e;
    font-size:24px;
    font-weight:800;
}

.brand b{
    display:block;
    font-size:17px;
}

.brand small{
    display:block;
    color:var(--muted);
    font-size:9px;
    margin-top:3px;
}

.engine{
    font-size:9px;
    color:#9ba6b2;
    white-space:nowrap;
}

.engine i{
    display:inline-block;
    width:7px;
    height:7px;
    border-radius:50%;
    background:var(--green);
    box-shadow:0 0 10px var(--green);
    margin-right:5px;
}

.hero{
    padding:22px;
    border:1px solid var(--line);
    border-radius:23px;
    background:rgba(255,255,255,.025);
    box-shadow:var(--shadow);
    backdrop-filter:blur(18px);
}

.tag{
    color:var(--green);
    font-size:9px;
    font-weight:800;
    letter-spacing:1.5px;
}

h1{
    font-size:clamp(28px,5vw,48px);
    line-height:1.05;
    letter-spacing:-2px;
    margin:9px 0;
}

h1 span{
    background:
        linear-gradient(
            90deg,
            var(--green),
            var(--blue)
        );
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
}

.desc{
    color:var(--muted);
    font-size:12px;
    line-height:1.65;
    max-width:750px;
}

.search{
    display:flex;
    gap:9px;
    margin-top:19px;
}

.search input{
    height:54px;
    min-width:0;
    flex:1;
    background:#05080c;
    border:1px solid rgba(0,255,170,.18);
    border-radius:13px;
    color:white;
    padding:0 15px;
    outline:none;
}

.search input::placeholder{
    color:#596574;
}

.search input:focus{
    border-color:var(--green);
    box-shadow:0 0 0 4px rgba(0,255,170,.06);
}

.scan{
    height:54px;
    border:0;
    border-radius:13px;
    padding:0 25px;
    font-weight:800;
    color:#00130e;
    background:
        linear-gradient(
            135deg,
            var(--green),
            var(--blue)
        );
    transition:.2s;
}

.scan:hover{
    transform:translateY(-1px);
    filter:brightness(1.08);
}

.scan.stop{
    color:#fff;
    background:
        linear-gradient(
            135deg,
            #ff365f,
            #ff764d
        );
}

.scan:disabled{
    opacity:.65;
}
